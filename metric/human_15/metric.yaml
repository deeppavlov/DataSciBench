    def vlm_judge(ground_truth):
        from src.vlm_utils import vlm_vis_quality

        prompt = """Above are two figures, A and B. A is a reference chart for the same task, B is the chart produced by the solution. Judge B on its own merits as the bar chart of total sales per year that the task asks for, against the requirements the task actually states. The total score is 5. Add one point for each criterion that B satisfies:
        - add 1 point for Readability: B is a real, non-empty bar chart, with the bars actually drawn and nothing blank, cropped or corrupted.
        - add 1 point for Yearly Totals: B has exactly two bars, one for 2022 and one for 2023, and their heights are the total sales of those years, 4800 for 2022 and 7800 for 2023, so the 2023 bar is clearly the taller one and the sales axis reaches about 8000; a chart showing the seven individual records instead of the two yearly totals does not get this point.
        - add 1 point for Red Bars with Black Edges: the bars are filled red and outlined in black, as the task requires.
        - add 1 point for Separated Bars: there is a visible gap between the two bars, they do not touch each other, as the task requires.
        - add 1 point for Axis Labels: the horizontal axis is the year and the vertical axis is sales, both are labelled and the tick labels are legible.

        Do not require B to match A in figure size or aspect ratio, in bar width, in grid lines, in tick label rotation or in the wording of the title, because the task does not fix any of them.

        ### Explanation:
        your explanation here

        ### Total Score:
        x/5
        """
        score = vlm_vis_quality(ground_truth, "bar_chart.png", prompt)
        return float(score)
