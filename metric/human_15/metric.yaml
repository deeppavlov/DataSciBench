    def vlm_judge(ground_truth):
        from src.vlm_utils import vlm_vis_quality

        prompt = """Above are two figures, A and B. A is a reference chart for the same task, B is the chart produced by the solution. Judge B on its own merits as the scatter chart of sales over time that the task asks for, against the requirements the task actually states. The total score is 5. Add one point for each criterion that B satisfies:
        - add 1 point for Readability: B is a real, non-empty scatter chart, with the points actually drawn and nothing blank, cropped or corrupted.
        - add 1 point for All Seven Records: B draws one point per row of the dataset, seven in all, at the sales values 1500, 1600, 1700, 1800, 1900, 2000 and 2100, against a time axis that covers January 2022 through December 2023.
        - add 1 point for Category Colors: the points are colored by category, three colors in all, the three 2022 points as Electronics, the January to March 2023 points as Furniture and the December 2023 point as Clothing.
        - add 1 point for Size Proportional to Sales: the marker area grows with the sales value, so the 2100 point is visibly the largest and the 1500 point the smallest; markers of equal size do not get this point.
        - add 1 point for Transparency: the markers are semi-transparent rather than solid, so what lies behind them shows through, as the task requires.

        Do not require B to match A in the color palette or in which color is given to which category, in how the time axis is formatted, in the presence or wording of a legend, in grid lines, in figure size or aspect ratio, or in the wording of the title and the axis labels, because the task does not fix any of them.

        ### Explanation:
        your explanation here

        ### Total Score:
        x/5
        """
        score = vlm_vis_quality(ground_truth, "scatter_chart.png", prompt)
        return float(score)
