    def pattern_analysis_completeness(ground_truth):
        import os

        try:
            from pypdf import PdfReader
        except ImportError:
            from PyPDF2 import PdfReader

        report = "pattern_analysis_report.pdf"
        if not os.path.exists(report) or os.path.getsize(report) == 0:
            return False
        with open(report, "rb") as file:
            pages = PdfReader(file).pages
            text = "".join(page.extract_text() or "" for page in pages).lower()
        return bool(len(text) > 300 and "default" in text and "trend" in text and "outlier" in text)
