    def clustering_validity(ground_truth):
        import os

        import numpy as np
        import pandas as pd
        from sklearn.preprocessing import StandardScaler

        if not os.path.exists("elbow_method.png") or os.path.getsize("elbow_method.png") < 5000:
            return False
        clusters = pd.read_csv("kmeans_clusters.csv")
        label_columns = [name for name in clusters.columns if "cluster" in str(name).lower() or "segment" in str(name).lower() or "label" in str(name).lower()]
        if not label_columns or len(clusters) < 1000:
            return False
        labels = clusters[label_columns[-1]]
        shares = labels.value_counts(normalize=True)
        if len(shares) < 2 or len(shares) > 15 or shares.max() > 0.95:
            return False
        source = pd.read_excel("../default of credit card clients.xls", header=1)
        features = [name for name in source.columns if name not in ("ID", "default payment next month")]
        id_columns = [name for name in clusters.columns if str(name).strip().lower() == "id"]
        if id_columns:
            assignment = pd.DataFrame({"ID": clusters[id_columns[0]], "label": labels.to_numpy()})
            merged = source[["ID"] + features].merge(assignment, on="ID")
        elif len(clusters) == len(source):
            merged = source[features].copy()
            merged["label"] = labels.to_numpy()
        else:
            return False
        if len(merged) < 1000:
            return False
        matrix = StandardScaler().fit_transform(merged[features].to_numpy(dtype=float))
        groups = merged["label"].to_numpy()
        total = float(((matrix - matrix.mean(axis=0)) ** 2).sum())
        within = float(sum(((matrix[groups == key] - matrix[groups == key].mean(axis=0)) ** 2).sum() for key in np.unique(groups)))
        return bool(total > 0 and 1 - within / total >= 0.1)
