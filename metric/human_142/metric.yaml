    def association_rules_validity(ground_truth):
        import pandas as pd

        rules = pd.read_csv("association_rules.csv")
        columns = {str(name).strip().lower(): name for name in rules.columns}
        required = ["antecedents", "consequents", "support", "confidence", "lift"]
        if any(name not in columns for name in required) or len(rules) < 5:
            return False
        antecedents = rules[columns["antecedents"]].astype(str).str.strip()
        consequents = rules[columns["consequents"]].astype(str).str.strip()
        if (antecedents.str.len() == 0).any() or (consequents.str.len() == 0).any():
            return False
        if len(set(zip(antecedents, consequents))) < 5:
            return False
        support = rules[columns["support"]].astype(float)
        confidence = rules[columns["confidence"]].astype(float)
        lift = rules[columns["lift"]].astype(float)
        if not support.between(0, 1).all() or not confidence.between(0, 1).all():
            return False
        if (support <= 0).any() or (confidence <= 0).any() or (lift <= 0).any():
            return False
        if "antecedent support" in columns:
            derived = support / rules[columns["antecedent support"]].astype(float)
            if not (derived - confidence).abs().lt(1e-2).all():
                return False
        return bool((lift > 1).any())
