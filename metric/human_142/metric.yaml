    def frequent_itemsets_validity(ground_truth):
        import pandas as pd

        itemsets = pd.read_csv("frequent_itemsets.csv")
        columns = {str(name).strip().lower(): name for name in itemsets.columns}
        if "support" not in columns or "itemsets" not in columns or len(itemsets) < 5:
            return False
        items = itemsets[columns["itemsets"]].astype(str).str.strip()
        support = itemsets[columns["support"]].astype(float)
        if (items.str.len() == 0).any() or items.nunique() < 5:
            return False
        if not support.between(0, 1).all() or (support <= 0).any():
            return False
        return bool(items.str.contains("[,;|&+]", regex=True).any())
