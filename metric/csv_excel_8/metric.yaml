    def vlm_judge(ground_truth):
        from src.vlm_utils import vlm_vis_quality

        prompt = """Above are two figures, A and B. A is a reference chart for the same task, B is the chart produced by the solution. Judge B on its own merits as the confusion matrix of the BP network trained to tell the 200 positive from the 200 negative samples, against the requirements the task actually states. The total score is 5. Add one point for each criterion that B satisfies:
        - add 1 point for Readability: B is a real, non-empty confusion matrix, with its cells actually drawn and nothing blank, cropped or corrupted.
        - add 1 point for Four Counts: the classification is binary, so B is a two by two block of exactly four cells and every cell carries a whole number, the count of test samples that fall into it.
        - add 1 point for Test Set Size: the four counts add up to the size of a test set held out of the 400 available samples, so their sum is a whole number well below 400, typically somewhere between 40 and 160, and never above 400.
        - add 1 point for Correct Classification: the two classes are far apart in this data and a correctly trained network separates them almost perfectly, so the two cells on the diagonal hold nearly every test sample while the two off-diagonal cells are zero or close to it; a matrix whose errors are comparable to its correct predictions, or one that puts every sample into a single row or column, does not get this point.
        - add 1 point for Axis Meaning and Labels: one axis is the predicted class and the other is the actual class, both are labelled as such, and the two classes are identified along both axes, for example as 0 and 1 or as negative and positive.

        How the matrix is rendered is left to the solution. Do not require B to be a colored heat map rather than a plain table, and do not require B to match A in the color map, in the orientation of the two axes, in the exact counts, in the number formatting, in figure size or aspect ratio, or in the exact wording of the title and the axis labels, because the task does not fix any of them.

        ### Explanation:
        your explanation here

        ### Total Score:
        x/5
        """
        score = vlm_vis_quality(ground_truth, "confusion_matrix.png", prompt)
        return float(score)
