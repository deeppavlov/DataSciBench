    def data_quality_score(ground_truth):
        import pandas as pd
        output = pd.read_csv("preprocessed_data.csv")
        gt_output = pd.read_csv(ground_truth)
        no_missing = output.isnull().sum().sum() == 0
        same_rows = 0.8 * gt_output.shape[0] <= output.shape[0] <= gt_output.shape[0]
        all_numeric = all(pd.api.types.is_numeric_dtype(dtype) for dtype in output.dtypes)
        return bool(no_missing and same_rows and all_numeric)
