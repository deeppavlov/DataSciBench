    def model_accuracy(ground_truth):
        from sklearn.metrics import accuracy_score, f1_score
        import pandas as pd
        def recompute(ground_truth):
            import os

            import joblib
            train = pd.read_csv(os.path.join(os.path.dirname(ground_truth), "..", "Bayesian_Dataset_train.csv"))
            prep = pd.read_csv("preprocessed_data.csv")
            model = joblib.load("naive_bayes_model.pkl")
            label = train.columns[-1]
            names = list(getattr(model, "feature_names_in_", [c for c in prep.columns if c != label]))
            pred = model.predict(prep[names].to_numpy(dtype=float))
            y = prep[label].to_numpy()
            return accuracy_score(y, pred), f1_score(y, pred)
        output = pd.read_csv("evaluation_results.csv")
        accuracy_row = output.loc[output['Metric'].str.lower().str.contains('accuracy')]
        acc = accuracy_row['Score'].values[0]
        gt_output = pd.read_csv(ground_truth)
        gt_acc_row = gt_output.loc[gt_output['Metric'].str.lower().str.contains('accuracy')]
        gt_acc = gt_acc_row['Score'].values[0]
        try:
            rec_acc, rec_f1 = recompute(ground_truth)
        except Exception:
            return False
        return bool(rec_acc >= gt_acc - 0.05 and abs(rec_acc - acc) <= 0.05)
