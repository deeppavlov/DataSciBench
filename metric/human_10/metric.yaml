    def visualization_completeness(ground_truth):
        import os
        from PIL import Image
        # Check if the visualizations file exists and is non-empty
        if os.path.exists("visualizations.png") and os.path.getsize("visualizations.png") > 0:
            with Image.open("visualizations.png") as image:
                low, high = image.convert("L").getextrema()
            return high - low > 30
        return False
