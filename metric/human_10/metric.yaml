    def calculate_mae(ground_truth):
        import numpy as np
        import pandas as pd
        from sklearn.metrics import mean_absolute_error

        output = pd.read_csv("predicted_prices.csv")
        predictions = pd.to_numeric(output["Predicted Prices"], errors="coerce")
        actual_values = pd.to_numeric(output["Actual Prices"], errors="coerce")
        if len(output) < 50 or not np.isfinite(predictions).all() or not np.isfinite(actual_values).all():
            print("predicted_prices.csv holds", len(output), "rows, all values finite:", bool(np.isfinite(predictions).all() and np.isfinite(actual_values).all()))
            return False
        prices = pd.read_csv("../train.csv")["SalePrice"]
        deviation = abs(float(actual_values.mean()) - float(prices.mean())) / float(prices.mean())
        if deviation > 0.15 or float(predictions.std()) <= 0:
            print("actual prices deviate from ../train.csv by", deviation, "predictions std is", float(predictions.std()))
            return False
        output_gt = pd.read_csv(ground_truth)
        reference = mean_absolute_error(output_gt["Actual Prices"], output_gt["Predicted Prices"])
        error = mean_absolute_error(actual_values, predictions)
        print("MAE:", error, "reference MAE:", reference)
        return bool(0.25 * reference <= error <= 2 * reference)
  "function": |-
