    def report_completeness(ground_truth_text):
        import re
        try:
            from pypdf import PdfReader
        except ImportError:
            from PyPDF2 import PdfReader
        with open('experimental_report.pdf', 'rb') as pdfobj:
            pdfreader = PdfReader(pdfobj)
            if len(pdfreader.pages) == 0:
                return False
            text = " ".join((page.extract_text() or "") for page in pdfreader.pages).lower()
        topics = [("data",), ("gradient descent",), ("regression", "fit"), ("plot", "chart", "figure", "graph", "visual")]
        missing = [group[0] for group in topics if not any(word in text for word in group)]
        words = set(re.findall(r"[a-z]+", text))
        print("required topics not found:", missing, "distinct words:", len(words))
        return bool(not missing and len(words) >= 50)
