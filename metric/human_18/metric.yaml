    def visualization_completeness(ground_truth):
        import os

        import pandas as pd
        from PIL import Image

        if not os.path.exists("pca_visualization.png"):
            return False
        with Image.open("pca_visualization.png") as image:
            image.load()
            low, high = image.convert("L").getextrema()
            if min(image.size) < 100 or high - low <= 30:
                return False

        output = pd.read_csv("pca_results.csv")
        if not {"PC1", "PC2"}.issubset(output.columns):
            return False
        num_points = output[["PC1", "PC2"]].dropna().shape[0]

        output_gt = pd.read_csv(ground_truth)
        num_points_gt = output_gt[["PC1", "PC2"]].dropna().shape[0]

        return num_points >= 0.9 * num_points_gt
  "function": |-
    Visualization Completeness
