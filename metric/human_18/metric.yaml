    def pca_explained_variance(ground_truth):
        import pandas as pd
        from sklearn.decomposition import PCA
        from sklearn.preprocessing import StandardScaler

        def reported_totals(df):
            cols = [c for c in df.columns if "explained" in c.lower() and "variance" in c.lower()]
            values = []
            for c in cols:
                values.extend(float(v) for v in pd.to_numeric(df[c], errors="coerce").dropna().unique())
            if not values:
                return []
            values.sort(reverse=True)
            totals = [sum(values), sum(values[:2]), values[0]]
            return [t for t in totals + [t / 100 for t in totals] if 0 < t <= 1 + 1e-6]

        def reference(rows):
            scaled = StandardScaler().fit_transform(rows)
            return float(PCA(n_components=2).fit(scaled).explained_variance_ratio_.sum())

        output = pd.read_csv("pca_results.csv")
        if not {"PC1", "PC2"}.issubset(output.columns) or len(output) == 0:
            return False

        var1 = output["PC1"].var()
        var2 = output["PC2"].var()
        if not var1 >= var2 > 0:
            return False

        source = pd.read_csv("../data.csv").select_dtypes("number").dropna()
        clean = source.copy()
        for column in clean.columns:
            low, high = clean[column].quantile(0.25), clean[column].quantile(0.75)
            clean = clean[clean[column].between(low - 1.5 * (high - low), high + 1.5 * (high - low))]
        refs = [reference(source), reference(clean)]

        return any(min(refs) - 0.05 <= t <= max(refs) + 0.05 for t in reported_totals(output))
