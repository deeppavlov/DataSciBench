    def model_performance_accuracy(ground_truth):
        import numpy as np
        import pandas as pd

        output = pd.read_csv("evaluation_results.csv")
        num_cols = [c for c in output.columns if pd.api.types.is_numeric_dtype(output[c])]
        text_cols = [c for c in output.columns if c not in num_cols]

        scores = {}
        if text_cols and num_cols:
            for name, value in zip(output[text_cols[0]], output[num_cols[0]]):
                scores[str(name).strip().lower()] = pd.to_numeric(value, errors="coerce")
        for col in num_cols:
            series = pd.to_numeric(output[col], errors="coerce").dropna()
            if len(series):
                scores[str(col).strip().lower()] = float(series.iloc[0])

        errors = [
            float(v)
            for k, v in scores.items()
            if any(t in k for t in ("mae", "mse", "error", "loss")) and np.isfinite(v)
        ]
        print("scores:", scores, "error metrics:", errors)
        if not errors:
            return False
        gt_values = pd.read_csv(ground_truth).apply(pd.to_numeric, errors="coerce").to_numpy(dtype=float)
        limit = 3 * float(np.nanmax(gt_values))
        return bool(all(0 <= e <= limit for e in errors) and max(errors) > 0)
