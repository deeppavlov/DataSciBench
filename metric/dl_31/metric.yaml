    def data_distribution_comparison(ground_truth):
        import numpy as np
        import pandas as pd
        from scipy.stats import ks_2samp

        output = pd.read_csv("train_set.csv")
        ground_truth_df = pd.read_csv(ground_truth)

        train_red = pd.to_numeric(output.iloc[:, 0:6].values.flatten(), errors="coerce")
        gt_red = ground_truth_df.iloc[:, 0:6].values.flatten()
        if not np.isfinite(train_red).all():
            return False

        enough_rows = len(output) >= 100
        in_range = bool((train_red >= 1).all() and (train_red <= 33).all())
        pvalue = float(ks_2samp(train_red, gt_red).pvalue)
        print("rows:", len(output), "in range 1-33:", in_range, "KS p-value:", pvalue)
        return bool(enough_rows and in_range and pvalue > 0.05)
