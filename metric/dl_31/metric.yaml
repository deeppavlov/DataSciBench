    def data_completeness(ground_truth):
        import pandas as pd

        raw = pd.read_csv("../data.txt", sep="\t", header=None)
        output = pd.read_csv("cleaned_data.csv", header=None)
        if output.iloc[0].map(lambda v: pd.to_numeric(v, errors="coerce")).isnull().any():
            output = output.iloc[1:]
        output = output.apply(pd.to_numeric, errors="coerce")
        kept = len(output) / len(raw)
        duplicates = int(output.duplicated().sum())
        missing = int(output.isnull().sum().sum())
        print("rows:", len(output), "of", len(raw), "columns:", output.shape[1], "duplicates:", duplicates, "missing:", missing)
        if output.shape[1] != raw.shape[1] or duplicates or missing:
            return False
        red = output.iloc[:, 0:6]
        blue = output.iloc[:, 6]
        in_range = bool(red.min().min() >= 1 and red.max().max() <= 33 and blue.min() >= 1 and blue.max() <= 16)
        print("in range:", in_range, "kept share:", kept)
        return bool(in_range and 0.8 <= kept <= 1.0)
