    def summary_statistics_consistency(ground_truth):
        import os
        import pandas as pd
        import numpy as np
        data = pd.read_csv("cleaned_data.csv")
        reference = pd.read_csv(os.path.join(os.path.dirname(ground_truth), "cleaned_data.csv"))
        for feature in ["age", "trestbps", "chol", "thalach"]:
            if feature not in data.columns or abs(data[feature].mean() - reference[feature].mean()) > 0.05 * abs(reference[feature].mean()):
                return False
        stats = pd.read_csv("eda_statistics.csv", index_col=0)
        if not {"age", "chol", "thalach"} <= {str(i).strip().lower() for i in stats.index}:
            stats = stats.T
        keys = pd.Series(stats.index.astype(str)).str.strip().str.lower()
        names = [str(c).strip().lower() for c in stats.columns]
        aliases = {"mean": ["mean"], "median": ["median", "50%"], "std": ["std", "std dev", "stddev", "standard deviation"]}
        for feature in ["age", "chol", "thalach", "sex", "cp", "target"]:
            if feature not in data.columns or int((keys == feature).sum()) != 1:
                return False
        for feature in ["age", "chol", "thalach"]:
            row = stats[(keys == feature).values].iloc[0]
            expected = {"mean": data[feature].mean(), "median": data[feature].median(), "std": data[feature].std()}
            for stat, options in aliases.items():
                found = [c for c, name in zip(stats.columns, names) if name in options]
                if not found:
                    return False
                value = pd.to_numeric(row[found[0]], errors="coerce")
                if not np.isfinite(value) or abs(value - expected[stat]) > 0.01 * max(abs(expected[stat]), 1.0):
                    return False
        return True
  "function": |-
    Data Consistency
  "metric": |-
    Summary Statistics Consistency
