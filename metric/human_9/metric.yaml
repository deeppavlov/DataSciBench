    def pattern_recognition_validity(ground_truth):
        import pandas as pd
        output = pd.read_csv("patterns_analysis.csv")
        if output.empty or output.shape[1] < 2:
            return False
        cells = set()
        for column in output.columns:
            cells.update(output[column].astype(str).str.strip().str.lower())
        if not {"age", "chol", "exang"}.issubset(cells):
            return False
        names = " ".join(str(c).lower() for c in output.columns)
        if "disease" not in names and "target" not in names:
            return False
        numeric = output.apply(pd.to_numeric, errors="coerce")
        source = pd.read_csv("../heart+disease/processed.cleveland.data", header=None, na_values="?")
        labels = output.astype(str).apply(lambda column: column.str.strip().str.lower())
        for name, index in (("age", 0), ("chol", 4)):
            expected = source[index].mean()
            values = numeric[labels.eq(name).any(axis=1)].to_numpy().ravel()
            if not any(abs(value - expected) <= 0.15 * expected for value in values if pd.notna(value)):
                return False
        return bool(int(numeric.notna().sum().sum()) >= 3 and int(numeric.nunique().sum()) >= 3)
  "function": |-
    Pattern Recognition Validity
  "metric": |-
    Pattern Recognition Validity
  "task_name": |-
    Pattern recognition
