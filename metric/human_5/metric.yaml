    def feature_selection_impact(ground_truth):
        import pandas as pd

        train = pd.read_csv("data/train_set.csv")
        test = pd.read_csv("data/test_set.csv")
        overlap = set(map(tuple, train.values)) & set(map(tuple, test.values))
        source = pd.read_csv("../WA_Fn-UseC_-HR-Employee-Attrition.csv").select_dtypes("number")
        shared = [c for c in source.columns if c in train.columns and train[c].nunique() > 1 and source[c].nunique() > 1]
        if len(shared) < 8 or not ((train[shared].corr() - source[shared].corr()).abs().to_numpy() <= 0.25).all():
            return False

        return (
            train.shape[0] >= 100
            and train.shape[1] >= 2
            and test.shape[0] >= 10
            and list(train.columns) == list(test.columns)
            and len(overlap) <= 0.05 * len(test)
        )
