    def f1_score_metric(ground_truth):
        import re

        import pandas as pd
        from sklearn.metrics import f1_score

        def norm(name):
            return re.sub(r"[^a-z0-9]", "", str(name).lower())

        def read_metric(aliases):
            table = pd.read_csv("results/evaluation_metrics.csv")
            keys = {norm(alias) for alias in aliases}
            for column in table.columns:
                if norm(column) in keys:
                    return float(table[column].iloc[0])
            columns = list(table.columns)
            if len(columns) >= 2:
                for _, row in table.iterrows():
                    if norm(row[columns[0]]) in keys:
                        return float(row[columns[1]])
            return None

        value = read_metric(["f1 score", "f1", "f1-score", "f measure"])
        if value is None or not 0.0 <= value <= 1.0:
            return False
        predictions = pd.read_csv("results/predictions.csv")
        actual = next((predictions[c] for c in predictions.columns if norm(c) in {"actual", "true", "ytrue", "actuallabel", "truelabel"}), None)
        predicted = next((predictions[c] for c in predictions.columns if norm(c) in {"predicted", "prediction", "pred", "ypred", "predictedlabel"}), None)
        if actual is None or predicted is None:
            return False
        test = pd.read_csv("data/test_set.csv")
        source = pd.read_csv("../WA_Fn-UseC_-HR-Employee-Attrition.csv").select_dtypes("number")
        shared = [c for c in source.columns if c in test.columns and test[c].nunique() > 1 and source[c].nunique() > 1]
        if len(shared) < 8 or not ((test[shared].corr() - source[shared].corr()).abs().to_numpy() <= 0.25).all():
            return False
        target = next((test[c] for c in test.columns if norm(c) in {"attrition", "target", "label", "churn"}), None)
        if target is None or len(target) != len(actual) or not (target.to_numpy() == actual.to_numpy()).all():
            return False
        rate = float((actual == 1).mean())
        if value <= 2 * rate / (1 + rate):
            return False
        return abs(f1_score(actual, predicted, average="binary", pos_label=1) - value) <= 0.02
