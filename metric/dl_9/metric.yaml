    def data_processing_correctness(ground_truth):
        import numpy as np
        import pandas as pd

        def parse_time(series, **kwargs):
            try:
                return pd.to_datetime(series, errors="coerce", **kwargs)
            except Exception:
                return pd.Series(pd.NaT, index=series.index)

        def is_time_column(series):
            if not pd.api.types.is_numeric_dtype(series):
                return bool(parse_time(series).notna().all())
            candidates = [
                parse_time(series, unit="s"),
                parse_time(series, unit="ms"),
                parse_time(series.map("{:.0f}".format), format="%Y%m%d"),
            ]
            return any(c.notna().all() and c.dt.year.between(2000, 2100).all() for c in candidates)

        output = pd.read_csv("processed_data.csv")
        numeric = output.select_dtypes(include="number")
        if len(output) < 7 or output.isnull().values.any():
            return False
        if numeric.empty or not np.isfinite(numeric.values).all():
            return False
        time_ok = any(is_time_column(output[column]) for column in output.columns)
        sales_ok = any(
            (numeric[column] >= 0).all() and numeric[column].sum() > 0 and numeric[column].nunique() > 1
            for column in numeric.columns
        )
        return bool(time_ok and sales_ok)
