    def association_rule_lift(ground_truth):
        import pandas as pd
        output = pd.read_csv("association_rules.csv")
        required = ["antecedents", "consequents", "support", "confidence", "lift"]
        if not set(required).issubset(output.columns) or len(output) < 5:
            return False
        if len(output[["antecedents", "consequents"]].drop_duplicates()) < 5:
            return False
        numbers = output[["support", "confidence", "lift"]]
        if numbers.isna().any().any():
            return False
        if not ((numbers["confidence"] > 0) & (numbers["confidence"] <= 1)).all():
            return False
        import re
        tokens = set()
        for year in range(2015, 2020):
            for column in pd.read_csv(f"../{year}.csv", nrows=0).columns:
                tokens.update(w for w in re.split(r"[^a-z]+", str(column).lower()) if len(w) > 3)
        items = " ".join(output["antecedents"].astype(str)) + " " + " ".join(output["consequents"].astype(str))
        if len(set(re.split(r"[^a-z]+", items.lower())) & tokens) < 3:
            return False
        return bool(numbers["lift"].median() > 1)
  "function": |-
    Pattern Recognition Validity
  "metric": |-
    Association Rule Strength (Lift)
