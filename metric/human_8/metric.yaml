    def data_cleaning_quality(ground_truth):
        import pandas as pd
        output = pd.read_csv("cleaned_data.csv")
        ground_truth_df = pd.read_csv(ground_truth)
        if output.shape[0] < ground_truth_df.shape[0] or output.shape[1] < 5:
            return False
        if output.select_dtypes(include="number").shape[1] < 4:
            return False
        source = pd.concat([pd.read_csv(f"../{year}.csv") for year in range(2015, 2020)], ignore_index=True).select_dtypes(include="number")
        numbers = output.select_dtypes(include="number")
        shared = [c for c in source.columns if c in numbers.columns and numbers[c].nunique() > 1]
        if len(shared) < 5 or not ((numbers[shared].corr() - source[shared].corr()).abs().to_numpy() <= 0.25).all():
            return False
        return bool(not output.isna().any().any() and not output.duplicated().any())
