    def feature_importance_scores(ground_truth):
        import os
        import pandas as pd
        output = pd.read_csv("pattern_analysis.csv")
        corr_cols = [c for c in output.columns if "correlation" in c.lower()]
        if not corr_cols:
            return False
        corr = pd.to_numeric(output[corr_cols].iloc[:, 0], errors="coerce").dropna()
        if len(corr) < 3 or corr.abs().max() > 1 or corr.max() < 0.5:
            return False
        source = set()
        for year in range(2015, 2020):
            source.update(str(c).strip().lower() for c in pd.read_csv(f"../{year}.csv", nrows=0).columns)
        labels = {str(c).strip().lower() for c in output.columns} | {str(v).strip().lower() for v in output.to_numpy().ravel()}
        if len(labels & source) < 3:
            return False
        data = pd.read_csv("cleaned_data.csv").select_dtypes(include="number")
        raw = pd.concat([pd.read_csv(f"../{year}.csv") for year in range(2015, 2020)], ignore_index=True).select_dtypes(include="number")
        shared = [c for c in raw.columns if c in data.columns and data[c].nunique() > 1]
        if len(shared) < 5 or not ((data[shared].corr() - raw[shared].corr()).abs().to_numpy() <= 0.25).all():
            return False
        score_cols = [c for c in data.columns if "score" in str(c).lower()]
        real = {round(float(v), 3) for c in score_cols for v in data.corr()[c].dropna()}
        if sum(any(abs(v - r) <= 0.02 for r in real) for v in corr) < 3:
            return False
        plots = ["scatter_plot.png", "heatmap.png", "cluster_plot.png"]
        return all(os.path.exists(f) and os.path.getsize(f) > 1000 for f in plots)
