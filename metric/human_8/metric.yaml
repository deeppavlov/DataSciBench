    def clustering_silhouette_score(ground_truth):
        import pandas as pd
        from sklearn.metrics import silhouette_score
        output = pd.read_csv("clusters.csv")
        label_col = "Cluster" if "Cluster" in output.columns else output.columns[-1]
        labels = output[label_col]
        features = output.drop(columns=[label_col]).select_dtypes(include="number")
        if features.shape[1] < 2 or features.isna().any().any():
            return False
        if labels.nunique() < 2 or labels.nunique() >= len(labels):
            return False
        source = pd.concat([pd.read_csv(f"../{year}.csv") for year in range(2015, 2020)], ignore_index=True).select_dtypes(include="number")
        shared = [c for c in source.columns if c in features.columns and features[c].nunique() > 1]
        if len(shared) < 5 or not ((features[shared].corr() - source[shared].corr()).abs().to_numpy() <= 0.25).all():
            return False
        reference = pd.read_csv(ground_truth)
        reference_label = "Cluster" if "Cluster" in reference.columns else reference.columns[-1]
        reference_features = reference.drop(columns=[reference_label]).select_dtypes(include="number")
        threshold = 0.5 * silhouette_score(reference_features, reference[reference_label])
        return bool(silhouette_score(features, labels) >= threshold)
  "function": |-
    Silhouette Score
  "metric": |-
    Clustering Silhouette Score
