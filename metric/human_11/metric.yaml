    def summary_statistics_accuracy(ground_truth):
        import re

        import pandas as pd

        data = pd.read_csv("cleaned_data.csv")
        source = pd.read_csv("../penguins_size.csv")
        reference = {re.sub(r"[^a-z0-9]", "", str(c).lower()): source[c].dropna() for c in source.select_dtypes("number").columns}
        eda = pd.read_csv("eda_results.csv", index_col=0)
        eda.index = eda.index.map(str)

        def column(names):
            for name in names:
                for col in eda.columns:
                    if str(col).strip().lower() == name:
                        return pd.to_numeric(eda[col], errors="coerce")
            return None

        stats = {
            "mean": column(["mean", "average"]),
            "median": column(["median", "50%"]),
            "std": column(["std", "stddev", "standard deviation"]),
        }
        if any(series is None for series in stats.values()):
            print("mean, median or std is missing among the columns", list(eda.columns))
            return False

        numeric = list(data.select_dtypes("number").columns)
        measurements = [c for c in numeric if any(k in c.lower() for k in ["culmen", "bill", "flipper", "body"])]
        if not measurements:
            print("no penguin measurement columns in cleaned_data.csv")
            return False

        for col in measurements:
            if col not in eda.index:
                print("no statistics reported for", col)
                return False
            base = reference.get(re.sub(r"[^a-z0-9]", "", str(col).lower()))
            if base is not None:
                for name in ("mean", "median"):
                    if abs(float(getattr(data[col], name)()) - float(getattr(base, name)())) > 0.05 * abs(float(getattr(base, name)())):
                        print(name, "of", col, "does not match ../penguins_size.csv")
                        return False
            for name, series in stats.items():
                expected = float(getattr(data[col], name)())
                reported = pd.to_numeric(pd.Series(series.loc[col]), errors="coerce").iloc[0]
                if pd.isna(reported) or abs(float(reported) - expected) > 1e-6 + 0.02 * abs(expected):
                    print(name, "of", col, "is", reported, "instead of", expected)
                    return False

        categorical = [c for c in data.columns if c not in numeric]
        named = [c for c in categorical if c.strip().lower().replace(" ", "_") in ("species", "island", "sex")]
        for col in named:
            if col not in eda.index:
                print("no summary reported for the categorical variable", col)
                return False

        print("checked", len(measurements), "numerical and", len(named), "categorical variables")
        return True
