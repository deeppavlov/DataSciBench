    def vlm_judge(ground_truth):
        from src.vlm_utils import vlm_vis_quality

        prompt = """Above are two figures, A and B. A is a reference chart for the same task, B is the chart produced by the solution. Judge B on its own merits as a scatter plot of the correlation between culmen length and flipper length of the Palmer Archipelago penguins, with a regression line. The total score is 5. Add one point for each criterion that B satisfies:
        - add 1 point for Readability: B is a real, non-empty scatter plot, with the points actually drawn and nothing blank, cropped or corrupted.
        - add 1 point for Same Data: B shows the same point cloud as A, covering the same ranges, roughly 32 to 60 mm horizontally and 170 to 232 mm vertically.
        - add 1 point for Correct Variables: culmen length in mm is on the horizontal axis and flipper length in mm is on the vertical axis.
        - add 1 point for Regression Line: a straight regression line is drawn through the point cloud and rises from left to right, as in A.
        - add 1 point for Axis Labels: both axes are labelled with the variable they show and the tick labels are legible.

        Do not require B to match A in the title text, in the exact wording of the axis labels (culmen length and bill length are two names of the same measurement), in colors, in the marker or line style, in the presence of a confidence band, in grid lines, in figure size or aspect ratio, because the task does not fix any of them.

        ### Explanation:
        your explanation here

        ### Total Score:
        x/5
        """
        score = vlm_vis_quality(ground_truth, "correlation_analysis.png", prompt)
        return float(score)
