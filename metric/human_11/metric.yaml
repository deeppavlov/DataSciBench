    def data_quality_score(ground_truth):
        import pandas as pd

        output = pd.read_csv("cleaned_data.csv")
        source = pd.read_csv("../penguins_size.csv").dropna()
        duplicates = int(output.duplicated().sum())
        missing = int(output.isnull().sum().sum())
        numeric_columns = int(output.select_dtypes("number").shape[1])
        print("shape:", output.shape, "duplicates:", duplicates, "missing:", missing, "numeric columns:", numeric_columns)
        return bool(len(output) >= max(30, 0.9 * len(source)) and numeric_columns >= 4 and duplicates == 0 and missing == 0)
