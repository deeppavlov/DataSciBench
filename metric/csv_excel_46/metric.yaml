    def vlm_judge(ground_truth):
        from src.vlm_utils import vlm_vis_quality

        prompt = """Above are two figures, A and B. A is a reference chart for the same task, B is the chart produced by the solution. Judge B on its own merits as a visual comparison of the accuracy of a Gaussian Naive Bayes model and a Multinomial Naive Bayes model, against the requirements the task actually states. The total score is 5. Add one point for each criterion that B satisfies:
        - add 1 point for Readability: B is a real, non-empty chart, with the bars or markers actually drawn and nothing blank, cropped or corrupted.
        - add 1 point for Both Models: B names and shows both models, the Gaussian Naive Bayes and the Multinomial Naive Bayes, and only those two, so there are exactly two bars or two compared items and no extra series.
        - add 1 point for Accuracy Scale: the quantity compared is accuracy, laid out on a scale that runs from 0 to 1 or from 0 to 100 per cent, with legible tick labels.
        - add 1 point for Correct Accuracies: both models reach an accuracy of 1.0 on this data, so the two bars are of equal height and both reach the top of the accuracy scale; a chart whose bars sit noticeably below that, for example at 0.5 or 0.7, or whose two bars differ in height, does not get this point.
        - add 1 point for Axis Labels and Caption: both axes are labelled and a legend or a title identifies what is plotted.

        Do not require B to match A in colors, in bar width, in figure size or aspect ratio, in tick label rotation or in the exact wording of the title, because the task does not fix any of them.

        ### Explanation:
        your explanation here

        ### Total Score:
        x/5
        """
        score = vlm_vis_quality(ground_truth, "model_comparison.png", prompt)
        return float(score)
