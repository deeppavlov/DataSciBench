    def gaussian_model_accuracy(ground_truth):
        import numpy as np
        import pandas as pd
        report = pd.read_csv("gaussian_model_accuracy.csv")
        accuracy = float(np.mean(pd.to_numeric(report["Accuracy"], errors="coerce")))
        held_out = pd.read_csv("gaussian_predictions.csv")
        actual_columns = [c for c in held_out.columns if "actual" in str(c).lower() or "true" in str(c).lower()]
        predicted_columns = [c for c in held_out.columns if "pred" in str(c).lower()]
        if not actual_columns or not predicted_columns or len(held_out) < 4:
            return False
        actual = pd.to_numeric(held_out[actual_columns[0]], errors="coerce")
        predicted = pd.to_numeric(held_out[predicted_columns[0]], errors="coerce")
        if actual.isna().any() or predicted.isna().any():
            return False
        source = pd.read_csv("../data.csv")
        target = source.columns[-1]
        features = [c for c in source.columns if c != target and c in held_out.columns]
        if not features:
            return False
        allowed = {}
        for row in source[features + [target]].values.tolist():
            allowed.setdefault(tuple(row[:-1]), set()).add(row[-1])
        rows = held_out[features].values.tolist()
        for row, value in zip(rows, actual.tolist()):
            if value not in allowed.get(tuple(row), set()):
                return False
        measured = float(np.mean(np.asarray(actual) == np.asarray(predicted)))
        reference = float(np.mean(pd.to_numeric(pd.read_csv(ground_truth)["Accuracy"], errors="coerce")))
        print("reported:", accuracy, "recomputed on", len(held_out), "held-out rows:", measured, "reference:", reference)
        return bool(abs(accuracy - measured) <= 0.005 and accuracy >= reference - 0.2)
