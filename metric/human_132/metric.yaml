    def report_completeness(ground_truth):
        import os

        try:
            from pypdf import PdfReader
        except ImportError:
            from PyPDF2 import PdfReader

        report = "customer_segmentation_analysis.pdf"
        if not os.path.exists(report) or os.path.getsize(report) == 0:
            return False
        with open(report, "rb") as file:
            pages = PdfReader(file).pages
            text = "".join(page.extract_text() or "" for page in pages).lower()
        if len(text) <= 300:
            return False
        if "cluster" not in text and "segment" not in text:
            return False
        return bool("age" in text and "income" in text and "spending" in text)
  "function": |-
    Report Completeness
