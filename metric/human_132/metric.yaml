    def clustering_validity(ground_truth):
        import pandas as pd
        from sklearn.metrics import silhouette_score

        features = ["Annual Income (k$)", "Spending Score (1-100)"]
        source = pd.read_csv("../data.csv")
        data = pd.read_csv("customer_segments.csv")
        data_gt = pd.read_csv(ground_truth)

        if "Cluster" not in data.columns:
            print("customer_segments.csv has no Cluster column")
            return False

        if len(data) < 0.9 * len(source):
            print("customer_segments.csv covers only", len(data), "of", len(source), "customers")
            return False

        clusters = data["Cluster"].nunique()
        if clusters < 2:
            print("only", clusters, "cluster in customer_segments.csv")
            return False

        def scored(labelled):
            if "CustomerID" in labelled.columns:
                merged = source.merge(labelled[["CustomerID", "Cluster"]], on="CustomerID")
            else:
                merged = source.head(len(labelled)).assign(Cluster=labelled["Cluster"].to_numpy())
            return silhouette_score(merged[features], merged["Cluster"])

        score, score_gt = scored(data), scored(data_gt)
        print("silhouette:", score, "ground truth:", score_gt, "clusters:", clusters, "rows:", len(data))
        return bool(score >= score_gt - 0.05)
  "function": |-
    Clustering Validity
  "metric": |-
    Silhouette Score
  "ground_truth": |-
    customer_segments.csv
