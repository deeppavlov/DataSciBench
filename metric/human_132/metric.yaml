    def vlm_judge(ground_truth):
        from src.vlm_utils import vlm_vis_quality

        prompt = """Above are two figures, A and B. A is a reference chart for the same task, B is the chart produced by the solution. Judge B on its own merits as an Elbow method chart used to choose the number of clusters for K-means on the annual income and spending score of the Mall Customers dataset, against the requirements the task actually states. The total score is 5. Add one point for each criterion that B satisfies:
        - add 1 point for Readability: B is a real, non-empty chart with a curve actually drawn and nothing blank, cropped or corrupted.
        - add 1 point for Elbow Curve: B plots the within-cluster sum of squares against the number of clusters, as a curve that falls all the way, steeply at first and then flattening out; a curve that rises, or that is a straight line, does not get this point.
        - add 1 point for Enough Cluster Counts: the horizontal axis covers a run of cluster counts wide enough for the bend to be seen, starting at one or two clusters and reaching at least eight.
        - add 1 point for Visible Elbow at Five: the curve bends at the same place as in A, around five clusters, after which it flattens, so five can be read off the chart as the optimal number of clusters.
        - add 1 point for Correct Magnitude: the within-cluster sum of squares is of the right order for this data, a few hundred thousand at one cluster, of the order of a hundred thousand at three and a few tens of thousands from five clusters onwards; values several orders of magnitude away, for example below a hundred or above ten million, do not get this point.

        Do not require B to match A in the line style, in the marker style, in the colors, in the title text, in the exact wording of the axis labels, in grid lines, in figure size or aspect ratio, because the task does not fix any of them. Do not require the vertical values of B to match A exactly: A was built after silently dropping outliers from the data, which lowers the whole curve by a few per cent, and the task does not ask for that cleaning.

        ### Explanation:
        your explanation here

        ### Total Score:
        x/5
        """
        score = vlm_vis_quality(ground_truth, "elbow_method.png", prompt)
        return float(score)
