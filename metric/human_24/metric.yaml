    def encoding_consistency_check(ground_truth):
        import os
        import pandas as pd
        if not os.path.exists("final_cleaned_data.csv"):
            raise FileNotFoundError("final_cleaned_data.csv")
        try:
            gt_dir = ground_truth if os.path.isdir(ground_truth) else os.path.dirname(ground_truth)
            output = pd.read_csv("final_cleaned_data.csv")
            gt = pd.read_csv(os.path.join(gt_dir, "final_cleaned_data.csv"))
            source = pd.read_csv(os.path.join(gt_dir, "step4_formatted_dates.csv"))
            if len(output) != len(gt):
                return False
            for column in ['ProductID', 'StoreID']:
                codes = pd.to_numeric(output[column], errors='coerce')
                if codes.isnull().any() or not (codes == codes.round()).all():
                    return False
                pairs = pd.DataFrame({'label': source[column].values, 'code': codes.values})
                if pairs.groupby('label')['code'].nunique().max() != 1:
                    return False
                if pairs.groupby('code')['label'].nunique().max() != 1:
                    return False
                unique_codes = sorted(set(codes.tolist()))
                if unique_codes != list(range(len(unique_codes))):
                    return False
                if len(unique_codes) != source[column].nunique():
                    return False
            return True
        except Exception:
            return False
