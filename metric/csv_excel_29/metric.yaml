    def vlm_judge(ground_truth):
        from src.vlm_utils import vlm_vis_quality

        prompt = """Above are two figures, A and B. A is a reference chart for the same task, B is the chart produced by the solution. Judge B on its own merits as a visualization of the LSTM time series predictions for the column "Value1" of data.csv, against the requirements the task actually states. The total score is 5. Add one point for each criterion that B satisfies:
        - add 1 point for Readability: B is a real, non-empty chart, with curves or markers actually drawn and nothing blank, cropped or corrupted.
        - add 1 point for Time Series Axes: B plots Value1 against time, with a date or step axis running left to right and the Value1 scale on the vertical axis.
        - add 1 point for Predicted Series: B shows a predicted Value1 series produced by the model over a run of consecutive time steps, not a single isolated point, and it is drawn inside or right after the span of the data, which runs from 2023-01-01 to 2023-07-19 over 200 daily records.
        - add 1 point for Correct Level: the observed Value1 wanders between about -1.2 and 1.2 around a mean near zero, so the series drawn sit on that order of magnitude and vary over time; a chart whose values are in the hundreds, or a flat constant line with no variation, does not get this point unless the axis is explicitly a rescaled or normalized one.
        - add 1 point for Axis Labels and Caption: both axes are labelled with legible tick labels, and a legend or a title identifies what is plotted.

        Whether B also draws the observed series next to the prediction, how the data is split, how many steps are predicted, the colors, the line styles, the figure size and the wording of the titles are left to the solution. Do not require B to match A in any of them.

        ### Explanation:
        your explanation here

        ### Total Score:
        x/5
        """
        score = vlm_vis_quality(ground_truth, "predictions_chart.png", prompt)
        return float(score)
