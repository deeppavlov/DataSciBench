    def model_mae(ground_truth):
        import numpy as np
        import pandas as pd

        source = pd.read_csv("../data.csv")
        actual = pd.Series(
            source["Value1"].astype(float).values, index=pd.to_datetime(source["Date"])
        )

        output = pd.read_csv("predictions.csv")
        pred_cols = [c for c in output.columns if "pred" in c.lower()]
        if not pred_cols:
            pred_cols = [c for c in output.columns if pd.api.types.is_numeric_dtype(output[c])]
        if not pred_cols:
            return False
        preds = pd.to_numeric(output[pred_cols[-1]], errors="coerce")

        date_cols = [c for c in output.columns if "date" in c.lower() or "time" in c.lower()]
        if date_cols:
            idx = pd.to_datetime(output[date_cols[0]], errors="coerce")
            paired = pd.DataFrame({"pred": preds.values, "actual": actual.reindex(idx).values})
        else:
            n = min(len(preds), len(actual))
            paired = pd.DataFrame({"pred": preds.values[-n:], "actual": actual.values[-n:]})
        paired = paired.dropna()

        if len(paired) < 10:
            print("not enough predictions aligned with Value1:", len(paired))
            return False

        mae = float(np.mean(np.abs(paired["pred"] - paired["actual"])))
        naive = float(np.mean(np.abs(paired["actual"] - actual.mean())))
        corr = float(paired["pred"].corr(paired["actual"]))
        print("MAE against actual Value1:", mae, "on", len(paired), "points; naive mean predictor:", naive, "correlation:", corr)
        return bool(1e-6 < mae < naive and corr > 0.5)
