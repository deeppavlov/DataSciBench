    def data_consistency_ratio(ground_truth):
        import numpy as np
        import pandas as pd

        source = pd.read_csv("../data.csv")
        value1 = source["Value1"].astype(float)

        output = pd.read_csv("predictions.csv")
        pred_cols = [c for c in output.columns if "pred" in c.lower()]
        if not pred_cols:
            pred_cols = [c for c in output.columns if pd.api.types.is_numeric_dtype(output[c])]
        if not pred_cols:
            return False

        preds = pd.to_numeric(output[pred_cols[-1]], errors="coerce")
        enough_rows = len(preds) >= 10
        all_finite = bool(np.isfinite(preds).all())
        not_constant = float(preds.std()) > 0.1 * float(value1.std())
        print("rows:", len(preds), "finite:", all_finite, "std:", float(preds.std()))
        return bool(enough_rows and all_finite and not_constant)
