    def statistical_analysis_results(ground_truth):
        import pandas as pd
        analysis_results = pd.read_csv("analysis_results.csv")
        values = pd.to_numeric(analysis_results.stack(), errors="coerce").dropna()
        source = pd.read_csv("../crawled_data.csv")
        column = next((c for c in source.columns if str(c).strip().lower() == "rating"), None)
        if column is None:
            return False
        rating = pd.to_numeric(source[column], errors="coerce").dropna()
        if values.empty or rating.empty:
            return False
        expected = [rating.mean(), rating.median(), rating.std()]
        return bool(all((values - v).abs().min() <= 0.05 for v in expected))
