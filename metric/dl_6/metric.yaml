    def data_cleaning_accuracy(ground_truth):
        import pandas as pd
        cleaned_data = pd.read_csv("cleaned_data.csv")
        gt_cleaned_data = pd.read_csv(ground_truth)
        if cleaned_data.empty or cleaned_data.isnull().values.any() or cleaned_data.duplicated().any():
            return False
        names = {str(c).strip().lower() for c in cleaned_data.columns}
        if not {str(c).strip().lower() for c in gt_cleaned_data.columns}.issubset(names):
            return False
        column = next((c for c in cleaned_data.columns if str(c).strip().lower() == "rating"), None)
        if column is None:
            return False
        rating = pd.to_numeric(cleaned_data[column], errors="coerce")
        return bool(rating.notna().all() and rating.between(0, 10).all())
  "function": |-
