    def association_rule_coverage(ground_truth):
        import ast
        import pandas as pd

        def canonical(itemsets):
            result = set()
            for value in itemsets:
                text = str(value).strip()
                if text.startswith("frozenset(") and text.endswith(")"):
                    text = text[len("frozenset("):-1]
                try:
                    items = ast.literal_eval(text)
                except (ValueError, SyntaxError):
                    items = [text]
                if isinstance(items, str):
                    items = [items]
                result.add(tuple(sorted(str(item).strip() for item in items)))
            return result

        output_itemsets = canonical(pd.read_csv("frequent_itemsets.csv")['itemsets'])
        ground_truth_itemsets = canonical(pd.read_csv(ground_truth)['itemsets'])

        return len(output_itemsets.intersection(ground_truth_itemsets)) / len(ground_truth_itemsets) >= 0.9
