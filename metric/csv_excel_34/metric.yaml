    def data_quality_score(ground_truth):
        import pandas as pd

        source = pd.read_csv("../data_pums_2000.csv")
        output = pd.read_csv("cleaned_data.csv")
        columns = {str(c).strip().upper(): c for c in output.columns}
        income_column = columns.get("INCTOT") or columns.get("INCOME")
        if income_column is None:
            return False

        src_columns = {str(c).strip().upper(): c for c in source.columns}
        shared = [(c, src_columns[str(c).strip().upper()]) for c in output.columns if str(c).strip().upper() in src_columns]
        if not shared:
            return False

        income = pd.to_numeric(output[income_column], errors="coerce")
        size_ok = 0.2 * len(source) <= len(output) < len(source)
        clean_ok = bool(income.notna().all()) and bool((income > 0).all())
        source_rows = set(map(tuple, source[[s for _, s in shared]].apply(pd.to_numeric, errors="coerce").values))
        output_rows = set(map(tuple, output[[o for o, _ in shared]].apply(pd.to_numeric, errors="coerce").values))
        subset_ok = output_rows.issubset(source_rows)
        print("rows:", len(output), "of", len(source), "clean:", clean_ok, "subset of source:", subset_ok)
        return bool(size_ok and clean_ok and subset_ok)
