    def calculate_gini_coefficient(ground_truth):
        import numpy as np
        import pandas as pd

        value = float(open("gini_coefficient.txt").read().strip())
        cleaned = pd.read_csv("cleaned_data.csv")
        columns = {str(c).strip().upper(): c for c in cleaned.columns}
        income_column = columns.get("INCTOT") or columns.get("INCOME")
        if income_column is None:
            return False
        def gini(values):
            values = np.sort(values)
            n = values.size
            total = values.sum()
            return (2 * np.sum(np.arange(1, n + 1) * values) - (n + 1) * total) / (n * total)

        income = pd.to_numeric(cleaned[income_column], errors="coerce").dropna().astype(float).values
        expected = gini(income)
        source = pd.read_csv("../data_pums_2000.csv")
        full = gini(pd.to_numeric(source["INCTOT"], errors="coerce").dropna().astype(float).values)
        reference = float(open(ground_truth).read().strip())
        low, high = min(reference, full) - 0.05, max(reference, full) + 0.05
        print("reported:", value, "recomputed from cleaned_data.csv:", expected, "admissible band:", low, high)
        return bool(low <= value <= high and abs(value - expected) <= 0.01)
