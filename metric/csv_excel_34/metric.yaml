    def vlm_judge(ground_truth):
        from src.vlm_utils import vlm_vis_quality

        prompt = """Above are two figures, A and B. A is a reference chart for the same task, B is the chart produced by the solution. Judge B on its own merits as a Lorenz curve of the income distribution of the 2000 census sample, against the requirements the task actually states. The total score is 5. Add one point for each criterion that B satisfies:
        - add 1 point for Readability: B is a real, non-empty chart with a curve actually drawn and nothing blank, cropped or corrupted.
        - add 1 point for Lorenz Shape: B shows a single curve running from the bottom left corner at 0, 0 to the top right corner at 1, 1, rising all the way, bending upwards, that is convex, and never going above the diagonal.
        - add 1 point for Line of Equality: the diagonal from 0, 0 to 1, 1 is drawn as a reference line, so the gap between perfect equality and the curve can be seen.
        - add 1 point for Correct Inequality: the gap matches the data, whose Gini coefficient is about 0.43, so the curve sits well below the diagonal, the poorer half of the population holds only about a fifth of the total income and the poorest fifth of the population holds a few per cent of it; a curve that almost touches the diagonal, or one that collapses onto the axes, does not get this point.
        - add 1 point for Axis Labels: both axes are labelled as cumulative shares of population and of income, with legible ticks on a 0 to 1 or a 0 to 100 per cent scale.

        Do not require B to match A in colors, in line styles, in grid lines, in figure size or aspect ratio, or in the wording of the title, and do not require the curvature to match A exactly, because the task does not fix how much cleaning is applied to the data.

        ### Explanation:
        your explanation here

        ### Total Score:
        x/5
        """
        score = vlm_vis_quality(ground_truth, "lorenz_curve.png", prompt)
        return float(score)
