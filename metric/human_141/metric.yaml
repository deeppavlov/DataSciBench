    def vlm_judge(ground_truth):
        from src.vlm_utils import vlm_vis_quality

        prompt = """Above are two figures, A and B. A is a reference chart for the same task, B is the chart produced by the solution. Judge B on its own merits as a grid of histograms of the numerical features of the "default of credit card clients" table, against the requirements the task actually states. The total score is 5. Add one point for each criterion that B satisfies:
        - add 1 point for Readability: B is a real, non-empty grid of histograms, with bars actually drawn and nothing blank, cropped or corrupted.
        - add 1 point for Numerical Coverage: B has a histogram for every genuinely numerical column of the table, that is the credit limit LIMIT_BAL, the AGE, the six bill amounts BILL_AMT1 to BILL_AMT6 and the six payment amounts PAY_AMT1 to PAY_AMT6, so at least fourteen panels.
        - add 1 point for Correct Distributions: the shapes match the data, AGE runs from about 21 to about 79 and peaks near 30, LIMIT_BAL peaks at low limits and thins out towards 1e6, and the bill and payment amounts are strongly right skewed with almost all mass near zero and long thin tails.
        - add 1 point for Full Sample: the counts are counts of the 30000 clients of the table, so the bars of a panel add up to that order of magnitude and the tallest bars run into the thousands or tens of thousands rather than into the tens.
        - add 1 point for Panel Labels and Count Axis: every panel is identified by the name of the column it shows, in a panel title or in an axis label, its vertical axis is a count or frequency of records with legible tick labels, and its horizontal axis spans the value range of that column.

        The identification of the numerical features is left to the solution, so both readings are correct. B may restrict itself to the fourteen genuine amounts and ages listed above, and B may also add panels for the integer coded columns ID, SEX, EDUCATION, MARRIAGE, PAY_0, PAY_2 to PAY_6 and the default payment target, as A does. Do not penalize B either for showing those extra columns or for leaving them out, and do not penalize B for having a different number of panels than A.

        Do not require B to match A in the number of panels, in the grid layout, in the number of bins, in colors, in bar edges, in grid lines, in figure size or aspect ratio, or in the presence and wording of an overall title, because the task does not fix any of them.

        ### Explanation:
        your explanation here

        ### Total Score:
        x/5
        """
        score = vlm_vis_quality(ground_truth, "numerical_histograms.png", prompt)
        return float(score)
