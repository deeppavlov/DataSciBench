    def vlm_judge(ground_truth):
        from src.vlm_utils import vlm_vis_quality

        prompt = """Above are two figures, A and B. A is a reference chart for the same task, B is the chart produced by the solution. Judge B on its own merits as a correlation heatmap of the features of the "default of credit card clients" table, against the requirements the task actually states. The total score is 5. Add one point for each criterion that B satisfies:
        - add 1 point for Readability: B is a real, non-empty heatmap, with the cells actually drawn and nothing blank, cropped or corrupted.
        - add 1 point for Correlation Matrix: B shows the pairwise correlations between the features of the table, one cell per pair of features, with the strength of the correlation encoded by color, the matrix symmetric about its diagonal and every value inside the range -1 to 1, the diagonal itself being the self-correlations equal to 1 or masked away. A heatmap of the raw values of the table, of the covariances or of anything else that is not a correlation matrix does not get this point.
        - add 1 point for Correct Correlation Blocks: the structure matches the data, the six bill amounts BILL_AMT1 to BILL_AMT6 form a solid block of strong positive correlations of about 0.80 to 0.95, and the repayment status columns PAY_0 and PAY_2 to PAY_6 form a second, weaker block of positive correlations of about 0.47 to 0.82; these two blocks are the only strongly correlated regions of the matrix and they stand out clearly from everything around them.
        - add 1 point for Correct Weak Links: the weak relations match the data too, the default payment target correlates with nothing strongly, its largest link being about 0.32 with PAY_0 and about -0.15 with LIMIT_BAL, the payment amounts PAY_AMT1 to PAY_AMT6 correlate only weakly with each other and with the bill amounts, and if B includes the row identifier ID then all of its cells are near zero. A chart where the target or ID lights up as strongly correlated with the features does not get this point.
        - add 1 point for Labels and Readable Scale: the names of the features label the rows and the columns along both axes, and the correlation values can be read off, either because they are annotated in the cells or because a color bar carries legible tick values.

        Which columns count as numerical is left to the solution, so do not penalize B either for including or for leaving out the integer coded columns ID, SEX, EDUCATION, MARRIAGE, PAY_0, PAY_2 to PAY_6 and the default payment target, as A includes them, and do not require B to have the same number of features as A. Judge the two blocks and the weak links only over the features B actually shows.

        Do not require B to show the full square: a triangular or masked heatmap with the redundant half or the diagonal left out is a normal way to draw a correlation matrix and loses no points. Do not require B to match A in the color map, in the presence of annotations in the cells, in the order of the features, in tick label rotation, in figure size or aspect ratio, or in the presence and wording of a title, because the task does not fix any of them.

        ### Explanation:
        your explanation here

        ### Total Score:
        x/5
        """
        score = vlm_vis_quality(ground_truth, "correlation_heatmap.png", prompt)
        return float(score)
