    def l1_norm(ground_truth):
        import os

        import pandas as pd
        import torch

        def load_state(path):
            try:
                state = torch.load(path, map_location="cpu")
            except Exception:
                state = torch.load(path, map_location="cpu", weights_only=False)
            if hasattr(state, "state_dict"):
                state = state.state_dict()
            if isinstance(state, dict):
                for value in state.values():
                    if isinstance(value, dict) and any(hasattr(item, "abs") for item in value.values()):
                        return value
            return state

        output = pd.read_csv("l1_norms.csv")
        state = load_state("trained_model.pth")
        weight_norms = sorted(float(param.abs().sum()) for name, param in state.items() if "weight" in name)
        all_norms = sorted(float(param.abs().sum()) for param in state.values())

        def matches(values, reference):
            return len(values) == len(reference) and all(
                abs(value - ref) <= 0.01 * max(abs(ref), 1.0) for value, ref in zip(values, reference)
            )

        def forward(features):
            layers = [
                (param, state.get(name[: -len("weight")] + "bias"))
                for name, param in state.items()
                if name.endswith("weight") and param.dim() == 2
            ]
            if not layers:
                return None
            out = features
            for index, (weight, bias) in enumerate(layers):
                if weight.shape[1] != out.shape[1]:
                    return None
                out = out @ weight.t()
                if bias is not None:
                    if bias.shape != (weight.shape[0],):
                        return None
                    out = out + bias
                if index < len(layers) - 1:
                    out = torch.relu(out)
            return out

        def trained_enough():
            if not (os.path.exists("../train.csv") and os.path.exists("../test.csv")):
                return False
            train = pd.read_csv("../train.csv")
            test = pd.read_csv("../test.csv")
            if "target" not in train.columns or "target" not in test.columns:
                return False
            x_train = torch.tensor(train.drop(columns=["target"]).values, dtype=torch.float32)
            x_test = torch.tensor(test.drop(columns=["target"]).values, dtype=torch.float32)
            y_test = torch.tensor(test["target"].values, dtype=torch.float32)
            baseline = float(((float(train["target"].mean()) - y_test) ** 2).mean())
            errors = []
            for features in (x_test, (x_test - x_train.mean(0)) / (x_train.std(0) + 1e-8)):
                out = forward(features)
                if out is None:
                    return False
                if out.shape[1] == 1:
                    candidates = [torch.sigmoid(out[:, 0]), out[:, 0]]
                elif out.shape[1] == 2:
                    probabilities = torch.softmax(out, dim=1)
                    candidates = [probabilities[:, 1], probabilities[:, 0]]
                else:
                    return False
                errors += [float(((candidate - y_test) ** 2).mean()) for candidate in candidates]
            errors = [error for error in errors if error == error]
            if not errors:
                return False
            print("baseline mse:", baseline, "model mse:", min(errors))
            return min(errors) <= 0.5 * baseline

        matched = False
        for column in output.columns:
            values = sorted(float(value) for value in pd.to_numeric(output[column], errors="coerce").dropna())
            print("column:", column, values, "expected:", weight_norms)
            if values and (matches(values, weight_norms) or matches(values, all_norms)):
                matched = True
                break
        if not matched:
            return False
        try:
            return trained_enough()
        except Exception:
            return False
