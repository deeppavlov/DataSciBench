    def code_completeness(ground_truth):
        import ast

        import torch

        def load_state(path):
            try:
                state = torch.load(path, map_location="cpu")
            except Exception:
                state = torch.load(path, map_location="cpu", weights_only=False)
            if hasattr(state, "state_dict"):
                state = state.state_dict()
            if isinstance(state, dict):
                for value in state.values():
                    if isinstance(value, dict) and any(hasattr(item, "abs") for item in value.values()):
                        return value
            return state

        with open("model_definition.py", "r") as f:
            tree = ast.parse(f.read())
        prefixes = {key.split(".")[0] for key in load_state("trained_model.pth")}

        def is_module(base):
            return (base.attr if isinstance(base, ast.Attribute) else getattr(base, "id", "")) == "Module"

        for cls in [node for node in ast.walk(tree) if isinstance(node, ast.ClassDef)]:
            methods = {node.name: node for node in cls.body if isinstance(node, ast.FunctionDef)}
            if not any(is_module(base) for base in cls.bases) or "forward" not in methods:
                continue
            layers = {
                target.attr
                for node in ast.walk(cls)
                if isinstance(node, ast.Assign) and isinstance(node.value, ast.Call)
                for target in node.targets
                if isinstance(target, ast.Attribute) and isinstance(target.value, ast.Name) and target.value.id == "self"
            }
            returns = [node for node in ast.walk(methods["forward"]) if isinstance(node, ast.Return)]
            print("class:", cls.name, "layers:", sorted(layers), "saved weights:", sorted(prefixes))
            if layers and returns and prefixes <= layers:
                return True
        return False
