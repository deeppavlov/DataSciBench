    def pruning_efficiency(ground_truth):
        import torch

        def load_state(path):
            try:
                state = torch.load(path, map_location="cpu")
            except Exception:
                state = torch.load(path, map_location="cpu", weights_only=False)
            if hasattr(state, "state_dict"):
                state = state.state_dict()
            if isinstance(state, dict):
                for value in state.values():
                    if isinstance(value, dict) and any(hasattr(item, "abs") for item in value.values()):
                        return value
            return state

        original_state_dict = load_state("trained_model.pth")
        pruned_state_dict = load_state("pruned_model.pth")
        if set(original_state_dict) != set(pruned_state_dict):
            return False

        total_weights = 0
        pruned_weights = 0
        pruned_values = []
        kept_values = []
        structured = []
        for name, original_param in original_state_dict.items():
            pruned_param = pruned_state_dict[name]
            if original_param.shape != pruned_param.shape:
                return False
            if "weight" not in name:
                if not torch.equal(original_param, pruned_param):
                    return False
                continue
            mask = (original_param != 0) & (pruned_param == 0)
            if not torch.equal(original_param[~mask], pruned_param[~mask]):
                return False
            total_weights += original_param.numel()
            pruned_weights += int(mask.sum())
            pruned_values.append(original_param[mask].abs())
            kept_values.append(original_param[~mask].abs())
            zeros = pruned_param == 0
            if zeros.dim() == 2:
                covered = zeros.all(dim=1).unsqueeze(1) | zeros.all(dim=0).unsqueeze(0)
                structured.append(bool((~zeros | covered).all()))
            else:
                structured.append(not bool(mask.any()))

        pruning_ratio = pruned_weights / total_weights if total_weights > 0 else 0
        pruned_values = torch.cat(pruned_values)
        kept_values = torch.cat(kept_values)
        smallest_first = kept_values.numel() > 0 and float(pruned_values.mean()) <= 0.9 * float(kept_values.mean())
        print("pruning ratio:", pruning_ratio, "smallest first:", smallest_first, "structured:", all(structured))
        return bool(0.01 <= pruning_ratio <= 0.9 and (smallest_first or all(structured)))
