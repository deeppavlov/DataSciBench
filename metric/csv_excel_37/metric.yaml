    def mean_absolute_error(ground_truth):
        import os
        import re

        import joblib
        import pandas as pd
        from sklearn.metrics import mean_squared_error, r2_score

        def extract_scores(file_path):
            with open(file_path, 'r') as file:
                content = file.read()

            mse_match = re.search(r"Mean Squared Error:\s*([\d.]+)", content)
            r2_match = re.search(r"R\^2 Score:\s*([\d.]+)", content)

            mse = float(mse_match.group(1)) if mse_match else None
            r2 = float(r2_match.group(1)) if r2_match else None

            return mse, r2

        def recompute(ground_truth):
            data = pd.read_csv(os.path.join(os.path.dirname(ground_truth), "..", "..", "date.csv"))
            model = joblib.load("results/model.pkl")
            for estimator in getattr(model, "estimators_", []):
                if not hasattr(estimator, "monotonic_cst"):
                    estimator.monotonic_cst = None
            X = data[["X", "Y"]]
            y = data[["ff", "ft", "tt", "tf"]]
            spaces = [(X, y), ((X - X.mean()) / X.std(ddof=0), (y - y.mean()) / y.std(ddof=0))]
            best = None
            for X_space, y_space in spaces:
                pred = model.predict(X_space.to_numpy())
                scores = (r2_score(y_space, pred), mean_squared_error(y_space, pred))
                if best is None or scores[0] > best[0]:
                    best = scores
            return best

        mse, r2 = extract_scores('results/acc.txt')
        gt_mse, gt_r2 = extract_scores(ground_truth)
        try:
            rec_r2, rec_mse = recompute(ground_truth)
        except Exception:
            return False
        return bool(mse is not None and 0 < mse <= gt_mse + 0.05 and rec_mse <= gt_mse + 0.05 and mse >= 0.9 * rec_mse)
