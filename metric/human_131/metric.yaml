    def vlm_judge(ground_truth):
        from src.vlm_utils import vlm_vis_quality

        prompt = """Above are two figures, A and B. A is a reference chart for the same task, B is the chart produced by the solution. Judge B on its own merits as histograms of the distribution of the numerical features of the Mall Customers dataset, against the requirements the task actually states. The total score is 5. Add one point for each criterion that B satisfies:
        - add 1 point for Readability: B is a real, non-empty figure of histograms, with the bars actually drawn and nothing blank, cropped or corrupted.
        - add 1 point for Feature Coverage: B has one histogram for each of the three numerical features Age, Annual Income (k$) and Spending Score (1-100).
        - add 1 point for Correct Ranges: the horizontal axis of each panel spans the real range of its feature, Age from about 18 to 70, Annual Income (k$) from about 15 to 137 and Spending Score (1-100) from about 1 to 99.
        - add 1 point for Correct Shapes: the shapes match the data, Age is skewed towards the young with its bulk between 20 and 50, Annual Income (k$) peaks around 50 to 80 and thins out towards 137, Spending Score (1-100) is broad with a peak around 40 to 60; three panels of the same shape, or a flat uniform ramp in a panel that names one of these three features, do not get this point.
        - add 1 point for Counts and Labels: the vertical axis of each panel is a count or a frequency of customers, the whole dataset being about 200 customers, and every panel is identified by a title or an axis label naming the feature it shows.

        A also plots CustomerID, which is a row identifier and not a feature, so its first panel is a flat uniform ramp carrying no information. Do not require B to plot CustomerID and do not penalize B for leaving it out; plotting it as an extra panel is equally acceptable and its flat shape is not held against B.

        Do not require B to match A in the grid layout or the number of panels, in figure size or aspect ratio, in colors, in the number of bins, in whether a density curve is overlaid, in the exact wording of the titles or axis labels, or in the exact bar heights, because the task does not fix any of them. A was built after silently dropping two rows as outliers, which the task never asks for, so B may legitimately show 200 rows against 198 in A.

        ### Explanation:
        your explanation here

        ### Total Score:
        x/5
        """
        score = vlm_vis_quality(ground_truth, "histograms.png", prompt)
        return float(score)
