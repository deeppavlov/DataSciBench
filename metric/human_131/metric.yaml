    def vlm_judge(ground_truth):
        from src.vlm_utils import vlm_vis_quality

        prompt = """Above are two figures, A and B. A is a reference chart for the same task, B is the chart produced by the solution. Judge B on its own merits as a pairplot of the numerical features of the Mall Customers dataset, meant to reveal clusters or patterns, against the requirements the task actually states. The total score is 5. Add one point for each criterion that B satisfies:
        - add 1 point for Readability: B is a real, non-empty matrix of panels, with the points actually drawn and nothing blank, cropped or corrupted.
        - add 1 point for Feature Coverage: the grid covers the three numerical features Age, Annual Income (k$) and Spending Score (1-100), with a panel for every pair of them.
        - add 1 point for Off-Diagonal Scatter Panels: the off-diagonal panels are scatter plots of one feature against another, drawn over the correct ranges, roughly 18 to 70 for Age, 15 to 137 for Annual Income (k$) and 1 to 99 for Spending Score (1-100).
        - add 1 point for Diagonal Distributions: the diagonal panels show the univariate distribution of each feature, either as a histogram or as a density curve.
        - add 1 point for Visible Clusters: the Annual Income (k$) against Spending Score (1-100) panels show the characteristic pattern, one dense central group plus four sparser corner groups.

        A also includes CustomerID in the grid, which is a row identifier and not a feature. Because the rows happen to be sorted by income, this produces a spurious near-perfect straight line between CustomerID and Annual Income (k$). Do not require B to include CustomerID and do not penalize B for a three by three grid instead of A's four by four; including CustomerID is acceptable but never required.

        Do not require B to match A on the choice of diagonal, histograms and density curves are equally acceptable, nor in colors, marker style or size, transparency, figure size, the presence or wording of a title, because the task does not fix any of them. A was built after silently dropping two rows as outliers, which the task never asks for, so B may legitimately show 200 points against 198 in A.

        ### Explanation:
        your explanation here

        ### Total Score:
        x/5
        """
        score = vlm_vis_quality(ground_truth, "pairplot.png", prompt)
        return float(score)
