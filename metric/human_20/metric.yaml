    def percentage_outlier_removal(ground_truth):
        import os
        import numpy as np
        import pandas as pd
        if not os.path.exists("step2_no_outliers.csv"):
            raise FileNotFoundError("step2_no_outliers.csv")
        try:
            gt_dir = os.path.dirname(ground_truth)
            output = pd.read_csv("step2_no_outliers.csv")
            original_count = len(pd.read_csv("step1_filled.csv"))
            new_count = len(output)
            pre_output = ((original_count - new_count) / original_count) * 100
            gt = pd.read_csv(ground_truth)
            gt_original_count = len(pd.read_csv(os.path.join(gt_dir, "step1_filled.csv")))
            gt_new_count = len(gt)
            gt_pre_output = ((gt_original_count - gt_new_count) / gt_original_count) * 100
            if pre_output != gt_pre_output or new_count != gt_new_count:
                return False
            return bool(np.allclose(output['Amount'].values, gt['Amount'].values))
        except Exception:
            return False
  "function": |-
    Data Quality Score
  "metric": |-
    Percentage of Outlier Removal
  "task_name": |-
    Data cleaning and preprocessing
  ground_truth: step2_no_outliers.csv
