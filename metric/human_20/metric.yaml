    def verify_datetime_format(ground_truth):
        import os
        import pandas as pd
        if not os.path.exists("step4_datetime.csv"):
            raise FileNotFoundError("step4_datetime.csv")
        try:
            gt_path = ground_truth if os.path.isfile(ground_truth) else os.path.join(ground_truth, "step4_datetime.csv")
            output = pd.read_csv("step4_datetime.csv")
            gt = pd.read_csv(gt_path)
            parsed = pd.to_datetime(output['TransactionDate'])
            gt_parsed = pd.to_datetime(gt['TransactionDate'])
            if len(parsed) != len(gt_parsed):
                return False
            return bool((parsed.values == gt_parsed.values).all())
        except Exception:
            return False
