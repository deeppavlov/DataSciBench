    def check_normalization(ground_truth):
        import os
        import numpy as np
        import pandas as pd
        if not os.path.exists("step3_normalized.csv"):
            raise FileNotFoundError("step3_normalized.csv")
        try:
            gt_path = ground_truth if os.path.isfile(ground_truth) else os.path.join(ground_truth, "step3_normalized.csv")
            output = pd.read_csv("step3_normalized.csv")
            gt = pd.read_csv(gt_path)
            if len(output) != len(gt):
                return False
            if not np.isclose(output['Amount'].min(), 0.0) or not np.isclose(output['Amount'].max(), 1.0):
                return False
            return bool(np.allclose(output['Amount'].values, gt['Amount'].values))
        except Exception:
            return False
