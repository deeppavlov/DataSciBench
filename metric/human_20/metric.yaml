    def completeness_filled(ground_truth):
        import os
        import pandas as pd
        if not os.path.exists("step1_filled.csv"):
            raise FileNotFoundError("step1_filled.csv")
        try:
            output = pd.read_csv("step1_filled.csv")
            gt = pd.read_csv(ground_truth)
            if len(output) != len(gt):
                return False
            if output['CustomerID'].isnull().any():
                return False
            return bool((output['CustomerID'].values == gt['CustomerID'].values).all())
        except Exception:
            return False
