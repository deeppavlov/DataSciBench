    def one_hot_encoding_completeness(ground_truth):
        import os
        import numpy as np
        import pandas as pd
        if not os.path.exists("final_output.csv"):
            raise FileNotFoundError("final_output.csv")
        try:
            gt_dir = ground_truth if os.path.isdir(ground_truth) else os.path.dirname(ground_truth)
            output = pd.read_csv("final_output.csv")
            gt = pd.read_csv(os.path.join(gt_dir, "final_output.csv"))
            categories = pd.read_csv(os.path.join(gt_dir, "step4_datetime.csv"))['Category']
            if len(output) != len(gt) or 'Category' in output.columns:
                return False
            base = {'CustomerID', 'TransactionDate', 'Amount'}
            encoded = [c for c in output.columns if c not in base and not c.startswith('Unnamed')]
            if len(encoded) != categories.nunique():
                return False
            values = output[encoded].to_numpy(dtype=float)
            if not np.isin(values, [0.0, 1.0]).all():
                return False
            if not (values.sum(axis=1) == 1).all():
                return False
            pairs = pd.DataFrame({'category': categories.values, 'column': values.argmax(axis=1)})
            if pairs.groupby('category')['column'].nunique().max() != 1:
                return False
            return bool(pairs.groupby('column')['category'].nunique().max() == 1)
        except Exception:
            return False
