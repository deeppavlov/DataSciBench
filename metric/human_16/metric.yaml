    def vlm_judge(ground_truth):
        from src.vlm_utils import vlm_vis_quality

        prompt = """Above are two figures, A and B. A is a reference chart for the same task, B is the chart produced by the solution. Judge B on its own merits as a scatter chart of a clustering result, against the requirements the task actually states. The total score is 5. Add one point for each criterion that B satisfies:
        - add 1 point for Readability: B is a real, non-empty scatter chart, with the points actually drawn and nothing blank, cropped or corrupted.
        - add 1 point for Same Data and Axes: B shows the same point cloud as A, three well separated groups sitting at the same coordinates, roughly -12 to 5 horizontally and -9 to 3.5 vertically, with the first column of the dataset on the horizontal axis and the second column on the vertical axis, and both axes labelled.
        - add 1 point for Distinct Cluster Colors: the clusters are drawn in different colors, so every cluster can be told apart from the others.
        - add 1 point for Equal Point Size: all points are drawn with the same marker size.
        - add 1 point for Darkness Ordered by Cluster Size: the bigger the number of points in a cluster, the darker its color; the large dense group in the lower left, about 500 points, is the darkest, the middle group, about 100 points, is lighter, and the sparse group on the right, about 10 points, is the lightest.

        Judge the last criterion only from B. A does not satisfy it, A colors the clusters by their label number, so in A the 100 point group is the lightest and the 10 point group is a middle shade. Do not copy A here and do not penalize B for disagreeing with A about colors.

        Do not require B to match A in the color palette, in whether the colors are explained by a colorbar or by a legend, in the title text, in the exact wording of the axis labels, in the numbering of the clusters, in marker transparency, in grid lines, in figure size or aspect ratio, because the task does not fix any of them.

        ### Explanation:
        your explanation here

        ### Total Score:
        x/5
        """
        score = vlm_vis_quality(ground_truth, "clustering_result.png", prompt)
        return float(score)
