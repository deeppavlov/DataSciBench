    def clustering_quality(ground_truth):
        from sklearn.metrics import silhouette_score
        import pandas as pd

        def cluster_labels(frame):
            for name in frame.columns:
                if str(name).strip().lower() == 'cluster':
                    return frame[name].tolist()
            return frame.iloc[:, -1].tolist()

        source = pd.read_csv('../data.csv')
        X = source.drop(columns='target').values

        output = pd.read_csv('clusters.csv')
        labels = cluster_labels(output)

        output_gt = pd.read_csv(ground_truth)
        labels_gt = cluster_labels(output_gt)

        return silhouette_score(X, labels) >= silhouette_score(X, labels_gt)
