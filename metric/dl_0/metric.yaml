    def descriptive_stats_difference(ground_truth):
        import numpy as np
        import pandas as pd
        output = pd.read_csv("combined_data.csv")
        gt_stats = pd.read_csv(ground_truth).describe()
        missing = [c for c in gt_stats.columns if c not in output.columns]
        if missing:
            print("columns missing in combined_data.csv:", missing)
            return False
        stats = output[gt_stats.columns].describe().reindex(index=gt_stats.index)
        stats = stats.values.astype(float)
        gt_stats = gt_stats.values.astype(float)
        print("max deviation of descriptive statistics:", np.nanmax(np.abs(stats - gt_stats)))
        return bool(np.allclose(stats, gt_stats, rtol=1e-10, atol=1e-12))
  "function": |-
    Data Consistency
  "metric": |-
    Descriptive Statistics Comparison
