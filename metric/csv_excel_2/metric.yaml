"prompt": |-
  Complete the following task based on Python:\nTask requirements: Use Short-Time Fourier Transform (STFT) to process time series data (training set "train.csv" and test set "test.csv") to obtain spectral images, and then classify the spectral images using a Convolutional Neural Network (CNN).\nSuggested steps:\n(1) Data feature analysis: Analyze the dataset (input: "train.csv", output: "data_analysis.txt"). Each sample is a one-dimensional time series, which can be directly plotted as a time series curve to observe the features from the curve. In practice, the sample curves of class 0 tend to have a stable period and amplitude, while the samples of class 1 do not converge. The file "data_analysis.txt" must be a text report that gives summary statistics of the samples and describes the observed differences between class 0 and class 1.\n(2) Sample filtering: Remove any abnormal training samples (input: "train.csv", output: "filtered_train.csv").\n(3) Time series feature extraction: Use STFT to process the sample data and obtain spectral images (input: "filtered_train.csv", output: "spectral_images_train.csv"). In the spectrum, the samples of class 0 present clear banded patterns due to their stable period and amplitude, while the samples of class 1 are chaotic.\n(4) Model training: Train the CNN with the spectral images from the training data to obtain the trained model (input: "spectral_images_train.csv", output: "cnn_model.h5").\n(5) Model testing: Evaluate the model's output on the test set (input: "test.csv" and "cnn_model.h5", output: "model_evaluation_results.csv"). The file "model_evaluation_results.csv" must contain one row per test sample, in the same order as "test.csv", and its last column must hold the predicted class label of that sample.
