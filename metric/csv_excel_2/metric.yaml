    def analysis_completeness(ground_truth):
        import os
        import re
        import numpy as np
        import pandas as pd
        train = pd.read_csv(os.path.join(os.path.dirname(ground_truth), "..", "train.csv"))
        with open("data_analysis.txt", 'r') as file:
            analysis = file.read().lower()
        stat_words = ["mean", "median", "std", "standard deviation", "min", "max", "variance"]
        reference = np.concatenate([train.mean(), train.median(), train.std(), train.min(), train.max()] + [
            [g.values.mean(), g.values.std(), g.values.min(), g.values.max(), np.median(g.values)]
            for _, g in train.drop(columns=["label"]).groupby(train["label"])])
        numbers = [float(x) for x in re.findall(r"-?\d+\.\d+", analysis)]
        has_stats = sum(bool(re.search(r"\b" + word + r"\b", analysis)) for word in stat_words) >= 2
        has_numbers = len(numbers) >= 5 and sum(bool(np.min(np.abs(reference - n)) <= 1e-4) for n in numbers) >= 5
        has_classes = "class" in analysis or "label" in analysis
        has_size = bool(re.search(r"\b%d\b" % len(train), analysis) or re.search(r"\b%d\b" % train.shape[1], analysis))
        return bool(len(analysis.split()) >= 50 and has_stats and has_numbers and has_classes and has_size)
