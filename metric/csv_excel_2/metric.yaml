    def spectral_image_clarity(ground_truth):
        import pandas as pd
        import numpy as np
        output = pd.read_csv("spectral_images_train.csv")
        gt_output = pd.read_csv(ground_truth)
        filtered_count = len(pd.read_csv("filtered_train.csv"))
        gt_variance = np.var(gt_output.values)
        clarity_score = np.var(output.values)
        shape_ok = len(output) == filtered_count and output.shape[1] > 1
        return bool(shape_ok and np.isfinite(output.values).all() and 0.1 * gt_variance <= clarity_score <= 10 * gt_variance)
