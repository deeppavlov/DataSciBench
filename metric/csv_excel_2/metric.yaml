    def outlier_removal_rate(ground_truth):
        import os
        import pandas as pd
        train = pd.read_csv(os.path.join(os.path.dirname(ground_truth), "..", "train.csv"))
        output = pd.read_csv("filtered_train.csv")
        removal_rate = (len(train) - len(output)) / len(train)
        return bool(list(output.columns) == list(train.columns) and 0 < removal_rate <= 0.2)
