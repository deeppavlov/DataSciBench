    def clustering_result_consistency(ground_truth):
        import pandas as pd
        def to_clusters(frame):
            names = list(frame.columns)
            groups = []
            for i in range(0, len(names), 2):
                points = frame[[names[i], names[i + 1]]].dropna().round(6).values.tolist()
                groups.append(sorted(tuple(point) for point in points))
            return sorted(groups)
        try:
            output = pd.read_csv("clustering_results.csv")
            gt_output = pd.read_csv(ground_truth)
            if len(output.columns) != len(gt_output.columns):
                return False
            return bool(to_clusters(output) == to_clusters(gt_output))
        except Exception:
            return False
