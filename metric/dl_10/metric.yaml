    def eda_completion_rate(ground_truth):
        import numpy as np
        import pandas as pd

        def prepare(df):
            df = df.set_index(df.columns[0])
            df.index = [str(i).strip() for i in df.index]
            df.columns = [str(c).strip() for c in df.columns]
            return df

        gt_output = prepare(pd.read_csv(ground_truth))
        output = prepare(pd.read_csv("eda_results.csv"))
        stat_names = set(gt_output.columns)
        if len(stat_names & set(output.index)) > len(stat_names & set(output.columns)):
            output = output.T
        identifier = str(pd.read_csv("../data.csv", nrows=1).columns[0]).strip()
        stats = [c for c in gt_output.columns if c in output.columns]
        rows = [r for r in gt_output.index if r in output.index]
        if len(stats) < len(gt_output.columns) or set(gt_output.index) - set(rows) - {identifier}:
            return False
        expected = gt_output.loc[rows, stats].apply(pd.to_numeric, errors="coerce").to_numpy(dtype=float)
        actual = output.loc[rows, stats].apply(pd.to_numeric, errors="coerce").to_numpy(dtype=float)
        return bool(np.allclose(expected, actual, rtol=1e-3, atol=1e-6))
