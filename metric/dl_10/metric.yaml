    def evaluation_metrics_report(ground_truth):
        import os
        import re

        import pandas as pd

        aliases = {
            "r2": "r2",
            "r2score": "r2",
            "rsquare": "r2",
            "rsquared": "r2",
            "coefficientofdetermination": "r2",
            "mse": "meansquarederror",
        }

        def normalize(name):
            key = re.sub(r"[^a-z0-9]", "", str(name).lower())
            return aliases.get(key, key)

        def to_dict(frame):
            values = pd.to_numeric(frame.iloc[:, 1], errors="coerce")
            return {normalize(n): v for n, v in zip(frame.iloc[:, 0], values)}

        output = to_dict(pd.read_csv("model_evaluation_results.csv"))
        gt_output = to_dict(pd.read_csv(ground_truth))
        if not set(gt_output).issubset(output):
            print("metrics missing in the report:", sorted(set(gt_output) - set(output)))
            return False
        if abs(output["r2"] - gt_output["r2"]) > 0.2:
            print("reported r2", output["r2"], "is far from the reference", gt_output["r2"])
            return False
        scales = [float(pd.read_csv("../data.csv").iloc[:, -1].var())]
        if os.path.exists("processed_features.csv"):
            scales.append(float(pd.read_csv("processed_features.csv").select_dtypes("number").iloc[:, -1].var()))
        implied = output["meansquarederror"] / max(1.0 - output["r2"], 1e-9)
        print("variance implied by the reported error:", implied, "target variance:", scales)
        return bool(any(0.5 <= implied / scale <= 2.0 for scale in scales if scale > 0))
