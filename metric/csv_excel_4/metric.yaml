    def plot_clarity_score(ground_truth):
        import numpy as np
        from PIL import Image
        image = np.asarray(Image.open("outlier_detection_plot.png").convert("RGB"), dtype=float) / 255.0
        if min(image.shape[:2]) < 200:
            return False
        shade = np.round(image * 8).astype(int)
        same = np.zeros(image.shape[:2], int)
        same[1:] += (shade[1:] == shade[:-1]).all(2)
        same[:-1] += (shade[:-1] == shade[1:]).all(2)
        same[:, 1:] += (shade[:, 1:] == shade[:, :-1]).all(2)
        same[:, :-1] += (shade[:, :-1] == shade[:, 1:]).all(2)
        core = shade[(image.min(2) < 0.9) & (same >= 2)]
        if len(core) < 0.002 * image.shape[0] * image.shape[1]:
            return False
        tones, counts = np.unique(core, axis=0, return_counts=True)
        main = tones[counts.argmax()]
        return bool(((np.abs(tones - main).sum(1) >= 4) & (counts > 0.05 * counts.sum())).any())
