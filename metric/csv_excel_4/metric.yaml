    def outlier_detection_rate(ground_truth):
        import pandas as pd
        def flags(frame):
            column = frame.iloc[:, -1].astype(str).str.strip().str.lower()
            return column.isin(["true", "1", "1.0", "yes", "outlier"]).to_numpy()
        gt_output = pd.read_csv(ground_truth)
        output = pd.read_csv("outliers_detected.csv")
        if output.shape[1] < 3 or len(output) != len(gt_output):
            return False
        detected, expected = flags(output), flags(gt_output)
        return bool((detected & expected).sum() >= 0.8 * expected.sum() and detected.sum() <= 3 * expected.sum())
