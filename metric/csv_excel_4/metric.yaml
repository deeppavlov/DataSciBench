    def mse_for_outlier_replacements(ground_truth):
        import numpy as np
        import pandas as pd
        gt_output = pd.read_csv(ground_truth)
        output = pd.read_csv("smoothed_data.csv")
        original = pd.read_csv("../ultimate_data.csv")["closing price"].to_numpy(float)
        detected = pd.read_csv("outliers_detected.csv").iloc[:, -1].astype(str).str.strip().str.lower()
        flags = detected.isin(["true", "1", "1.0", "yes", "outlier"]).to_numpy()
        if len(output) != len(gt_output) or not flags.any():
            return False
        smoothed = output.iloc[:, -1].to_numpy(float)
        gt_smoothed = gt_output.iloc[:, -1].to_numpy(float)
        if np.mean((smoothed - gt_smoothed) ** 2) > 0.25 * np.mean((original - gt_smoothed) ** 2):
            return False
        errors = []
        for with_self in (False, True):
            reference = original.copy()
            for i in np.flatnonzero(flags):
                window = [j for j in range(max(0, i - 5), min(len(original), i + 6)) if with_self or j != i]
                reference[i] = original[window].mean()
            errors.append(np.mean((smoothed - reference) ** 2))
        return bool(min(errors) < 0.05 * original[~flags].var())
