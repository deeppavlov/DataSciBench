[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
extend-exclude = [
    "metagpt/",
    "data/",
    "logs/",
    "log_archive/",
    "notebooks/",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # конфликтует с форматтером
    "ISC001",   # конфликтует с форматтером
    "D",        # докстринги в проекте не пишутся
    "S102",     # exec — механика запуска проверок метрик
    "S307",     # eval — компиляция правил из metric.yaml
    "S603",     # subprocess без shell — запуск решений
    "S108",     # временные файлы в тестах
    "T20",      # print — штатный вывод скриптов
    "ANN",      # аннотации требует mypy в строгой зоне
    "ERA001",   # закомментированный код
    "RUF001",   # кириллица в строках
    "RUF003",   # кириллица в комментариях
    "PTH",      # os.path вместо pathlib — отдельный рефакторинг
    "INP001",   # пакеты без __init__.py — текущая раскладка
    "TID252",   # относительные импорты внутри пакетов
    "FBT",      # boolean trap
    "TD",       # оформление TODO
    "FIX",      # наличие TODO
    "EM",       # тексты исключений
    "TRY003",   # тексты исключений
    "E501",     # длинные строки
    "PLR2004",  # магические числа
    "BLE001",   # прогон бенчмарка повсеместно ловит Exception, чтобы сбой одной задачи не прерывал остальные
    "PLC0415",  # импорт внутри функции
    "N806",     # X_train и подобные имена приняты в ML-коде
    "C901",     # сложность функций
    "PLR0912",  # сложность функций
    "PLR0915",  # сложность функций
]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "metagpt.roles.role.Role",
    "metagpt.actions.action.Action",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "PLR2004", "SLF", "PT009", "PT027"]
"benchmark_generator/tests/*.py" = ["S101", "PLR2004", "SLF", "PT009", "PT027"]
"**/*.ipynb" = ["E402", "E722"]
"experiments/*.py" = ["F403", "F405"]
"evaluations/*.py" = ["F403", "F405"]
"src/schemas/__init__.py" = ["F401"]
"src/evaluator/__init__.py" = ["F401"]
"role/__init__.py" = ["F401"]
"experiments/run_examples.py" = ["G004"]
"benchmark_generator/pipelines/pipeline_code_mode.py" = ["ASYNC240", "ASYNC250"]
# assert в боевом коде: исчезает под python -O, каждое место требует отдельного решения
"src/logs.py" = ["S101"]
"src/schemas/dag.py" = ["S101"]
"scripts/validate_benchmark.py" = ["S101"]
"experiments/evaluate.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
files = [
    "src",
    "benchmark_generator",
    "sft",
    "experiments",
    "scripts",
    "utils",
    "role",
    "tests",
    "evaluation_results",
    "evaluations",
]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
local_partial_types = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
module = ["src.*", "benchmark_generator.*", "sft.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["metagpt.*"]
ignore_errors = true

# локальный файл с ключами, в git не хранится — в CI его нет
[[tool.mypy.overrides]]
module = ["src.vlm_config"]
ignore_missing_imports = true

# ставятся только в GPU-окружении кластера, локально и в CI отсутствуют (sft/train_model.py)
[[tool.mypy.overrides]]
module = [
    "datasets",
    "transformers",
    "transformers.*",
    "trl",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "benchmark_generator/tests"]
# паттерны --only-rerun сопоставляются с "ИмяТипа: сообщение", поэтому якорь ^ и ":"
# ограничивают совпадение типом исключения и не дают матчить текст сообщения
addopts = """
    -ra
    --reruns 2
    --reruns-delay 5
    --only-rerun ^ReadTimeout:
    --only-rerun ^ConnectError:
    --only-rerun ^ConnectTimeout:
    --only-rerun ^APITimeoutError:
    --only-rerun ^APIConnectionError:
"""

[dependency-groups]
dev = [
    "mypy~=1.19",
    "pandas-stubs>=3.0.5.260730",
    "pytest~=9.0",
    "pytest-rerunfailures~=16.0",
    "ruff~=0.15.8",
    "types-pyyaml>=6.0.12.20260815",
]
