name: Reusable Workflow

on:
  workflow_call:
    inputs:
      test_command:
        required: true
        type: string
        description: 'Command to run tests'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.10.0"
        enable-cache: false
    - name: Install dependencies
      run: uv sync --locked --all-groups
    - name: Run tests
      env:
        TEST_COMMAND: ${{ inputs.test_command }}
      run: uv run --no-sync $TEST_COMMAND
